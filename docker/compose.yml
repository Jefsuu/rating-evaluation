networks:
  app-tier:
    driver: bridge
  mlops_net:

# volumes:
#   kafka_data:
#     driver: local
#   postgres_data:
#     './volumes/postgresql_data:/bitnami/postgresql/data/'

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - app-tier
    volumes:
      - './volumes/kafka_data:/bitnami/kafka'

  postgresql:
    image: bitnami/postgresql
    container_name: postgresql
    # build:
    #   context: .
    #   target: postgresql
    #   dockerfile: Dockerfile
    volumes:
      - './volumes/postgresql_data:/bitnami/postgresql/data/'
    ports:
      - '5432:5432'
    environment:
      #- POSTGRESQL_DATABASE=dev_db
      - POSTGRESQL_USERNAME=dev_user
      - POSTGRESQL_PASSWORD=1234
      - POSTGRESQL_POSTGRES_PASSWORD=1234
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev_user"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - app-tier
  
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    ports:
      - "5000:5000"
    # volumes:
    #   - mlflow_data:/mlruns
    #   - mlflow_db:/mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://dev_user:1234@postgresql/mlflow
      --artifacts-destination s3://mlflow
      --default-artifact-root s3://mlflow
      --host 0.0.0.0
      --port 5000
      --cors-allowed-origins '*'
      --allowed-hosts '*'
    networks:
      - app-tier
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      # - AWS_DEFAULT_REGION=sa-east-1
      # - MLFLOW_S3_IGNORE_TLS=true
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - minio
    
  model-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_model_server
    ports:
      - "5001:5001"
    # volumes:
    #   - mlflow_data:/mlruns
    #   - mlflow_db:/mlflow
    command: >
      mlflow models serve -m models:/SentimentModel/Production
      --host 0.0.0.0
      --port 5001
    networks:
      - app-tier
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - MLFLOW_SERVER_ALLOWED_HOSTS='*'
      # - AWS_DEFAULT_REGION=sa-east-1
      # - MLFLOW_S3_IGNORE_TLS=true
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-v", "http://localhost:5001/health"]
      interval: 10s
      timeout: 3s
      retries: 60

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001" # Console port
    # volumes:
    #   - ./minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - app-tier

  review_writer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.executors
    container_name: review_writer
    command: sh -c "while true; do uv run ./Executors/kafka_to_postgres_review_writer.py; sleep 300; done"
    # restart: unless-stopped
    # ports:
    #   - "8000:8000"
    depends_on:
      - kafka
      - postgresql
    networks:
      - app-tier
  
  review_predictor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.executors
    container_name: review_predictor
    command: sh -c "while true; do uv run ./Executors/review_predict_to_postgres.py; sleep 300; done"
    # restart: unless-stopped
    # ports:
    #   - "8000:8000"
    depends_on:
      kafka:
        condition: service_started
      postgresql:
        condition: service_started
      mlflow:
        condition: service_started
      minio:
        condition: service_started
      model-server:
        condition: service_healthy
    networks:
      - app-tier
    

